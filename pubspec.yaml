name: your_app_name
description: A new Flutter project

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_sound: ^9.2.13
  path_provider: ^2.1.1
  kakao_flutter_sdk_user: ^1.3.1  # 최신 버전 확인
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  speech_to_text: ^6.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/scenario/
    - assets/img/
    - assets/profile/
  fonts:
    - family: nanum_b
      fonts:
        - asset: assets/fonts/NanumSquareRoundB.ttf
    - family: nanum_eb
      fonts:
        - asset: assets/fonts/NanumSquareRoundEB.ttf
    - family: nanum_l
      fonts:
        - asset: assets/fonts/NanumSquareRoundL.ttf
    - family: nanum_otfl
      fonts:
        - asset: assets/fonts/NanumSquareRoundOTFL.otf
    - family: nanum_r
      fonts:
        - asset: assets/fonts/NanumSquareRoundR.ttf
    - family: gmarket_medium
      fonts:
        - asset: assets/fonts/GmarketSansTTFMedium.ttf
    - family: gmarket_light
      fonts:
        - asset: assets/fonts/GmarketSansTTFLight.ttf
    - family: gmarket_bold
      fonts:
        - asset: assets/fonts/GmarketSansTTFBold.ttf